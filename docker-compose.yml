# Self-hostable did:btcr2 aggregation coordinator.
#
# `docker compose up --build` runs a real coordinator on mutinynet (fast, free
# coins, no real money) serving the SPA + API on http://localhost:8080. Flip the
# behavior with environment variables (or a .env file next to this one); the full
# reference is docs/DEPLOY.md.
#
# One image serves any network: the browser reads the chain at runtime from
# GET /v1/config, so you never rebuild to switch networks - just change NETWORK.

name: btcr2-aggregation

services:
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile
    image: btcr2-aggregation-coordinator:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Chain the coordinator and browser use. mutinynet default; an unknown name
      # fails fast at boot. signet | testnet3 | testnet4 | regtest | bitcoin.
      NETWORK: ${NETWORK:-mutinynet}
      # LIVE=1 uses a real esplora connection (server-side resolution + the
      # /v1/tx/* registration proxy). Empty = offline (no chain I/O).
      LIVE: ${LIVE:-}
      # BROADCAST=1 (requires LIVE=1) additionally builds and BROADCASTS a real
      # aggregation beacon tx per cohort. This is the only env-exposed path that
      # moves Bitcoin for cohort beacons: you must fund each cohort beacon address
      # within its funding window or the cohort dead-ends. Empty = fixture co-sign.
      BROADCAST: ${BROADCAST:-}
      # How long (ms) co-signing waits for you to fund a cohort beacon address
      # before the cohort fails with a funding reason. Default 720000 (12 min);
      # PHASE_TIMEOUT_MS must EXCEED it or the boot refuses (checked under
      # BROADCAST=1). A malformed value is ignored with a warning.
      FUNDING_WINDOW_MS: ${FUNDING_WINDOW_MS:-}
      # Send the beacon tx's change to your own funding wallet instead of back to
      # the cohort beacon address (ADR 044). Empty = change returns to the beacon.
      LIVE_CHANGE_ADDRESS: ${LIVE_CHANGE_ADDRESS:-}
      # Optional display name for this service, shown on the operator health strip
      # and the public directory header. Plain text; empty = no name shown.
      # Editable at runtime from the operator settings surface; a restart returns
      # it to this value (that is true of every runtime setting - see
      # docs/DEPLOY.md "What survives a restart").
      SERVICE_NAME: ${SERVICE_NAME:-}
      # Boot SEEDS for what a NEW cohort draft starts from. Each is editable at
      # runtime from the operator settings surface, applies to new drafts only
      # (an advertised cohort's shape never changes), and returns to the value
      # here on restart. A malformed value warns at boot and falls back.
      # Beacon type: CASBeacon (default) or SMTBeacon.
      DEFAULT_BEACON_TYPE: ${DEFAULT_BEACON_TYPE:-CASBeacon}
      # Seats (n) and the k-of-n fallback threshold. k defaults to n and is
      # clamped to it, so a malformed pair can never seed an unsatisfiable draft.
      DEFAULT_SIZE: ${DEFAULT_SIZE:-2}
      DEFAULT_THRESHOLD: ${DEFAULT_THRESHOLD:-}
      # Per-draft timing windows in ms (minimum 60000 each). Empty = the service
      # defaults apply (the built-in discovery window; FUNDING_WINDOW_MS for
      # funding). The discovery window can only SHORTEN a cohort relative to
      # COHORT_TTL_MS, and the two paths that set it answer differently on purpose:
      # a value above the ceiling HERE is clamped down to it at boot with a warning
      # naming both numbers, while a runtime save above it is refused with the real
      # maximum named. Neither path ever accepts a window it cannot enforce.
      DEFAULT_DISCOVERY_WINDOW_MS: ${DEFAULT_DISCOVERY_WINDOW_MS:-}
      DEFAULT_FUNDING_WINDOW_MS: ${DEFAULT_FUNDING_WINDOW_MS:-}
      # Participation terms shown at join in the web app. Set = joining through
      # the web app requires a DID-signed acceptance, verified server-side and
      # bound to the hash of the exact text shown. Empty = no terms step at all.
      # Enforcement is APP-LEVEL: a client speaking the protocol directly joins
      # without the step (docs/DEPLOY.md says so plainly; do not represent this
      # as protocol-level consent).
      TERMS_TEXT: ${TERMS_TEXT:-}
      # Point resolution + the tx proxy at your own indexer (needs LIVE=1). Empty
      # uses the registry's public host for NETWORK.
      ESPLORA_HOST: ${ESPLORA_HOST:-}
      # Mainnet moves real funds, so it is refused without this explicit opt-in
      # even offline. Leave empty for test networks.
      ALLOW_MAINNET: ${ALLOW_MAINNET:-}
      # Operator-held x-only recovery public key (64 hex) for every cohort's ADR
      # 042 recovery leaf. REQUIRED before any beacon is funded for real; without
      # it cohorts get a throwaway key whose secret is discarded (funds-loss mode).
      RECOVERY_KEY: ${RECOVERY_KEY:-}
      # Operator console password (HOST-01, ADR 0015). Set this to enable the
      # login-gated operator console + gated monitoring. UNSET = fail-closed: the
      # public participant surface still serves, but the operator console, the
      # mutating cohort routes, and the gated monitoring reads (GET
      # /v1/operator/cohorts and /v1/operator/cohorts/:id) are disabled with a loud
      # boot warning. Never commit a real value; keep it in a .env file, never baked
      # into the image. SET THIS BEFORE YOUR FIRST RUN: because this service
      # advertises nothing on its own, an empty password means no console, so no
      # cohort can ever be created and the directory stays empty. See the quick
      # start in docs/DEPLOY.md.
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
      # Optional: operator session lifetime in ms (default 24h) and the cookie Secure
      # flag. Leave OPERATOR_COOKIE_SECURE default (on) behind a TLS proxy; set it to
      # 0 ONLY for a local plain-http run, else the browser drops the session cookie.
      OPERATOR_SESSION_TTL_MS: ${OPERATOR_SESSION_TTL_MS:-}
      OPERATOR_COOKIE_SECURE: ${OPERATOR_COOKIE_SECURE:-}
      # Fallback seed for the seat count (n) a NEW draft starts from. DEFAULT_SIZE
      # above seeds the same thing and wins, and it is always set here, so this
      # variable is shadowed on this path; it is kept for a bare run that sets
      # neither. It does NOT decide what completes a cohort: that is the per-draft
      # n the operator advertised. To rehearse a cohort alone, use the console's
      # "Fill remaining seats with test peers" control, not a boot knob.
      MIN_PARTICIPANTS: ${MIN_PARTICIPANTS:-2}
      # AUTO_FALLBACK=0 opts OUT of the ADR 042 k-of-n script-path fallback on a
      # signing stall. Behavior-changing: with it off, a round stuck on a missing
      # co-signer no longer recovers on its own (the operator must Finalize now, or
      # the cohort fails). Default on. SSE_DEBUG=1 logs the participant advert SSE
      # transport's per-connection activity; diagnostics only, changes no behavior.
      AUTO_FALLBACK: ${AUTO_FALLBACK:-}
      SSE_DEBUG: ${SSE_DEBUG:-}
      # Opt-in IPFS (Helia) pinning (ADR 0011). IPFS_DIR persists pins across
      # restarts (mount the volume below); IPFS_ANNOUNCE advertises a wss multiaddr
      # for browsers on an https page to dial through your TLS proxy.
      IPFS: ${IPFS:-}
      IPFS_DIR: ${IPFS_DIR:-}
      IPFS_ANNOUNCE: ${IPFS_ANNOUNCE:-}
    # Uncomment together with IPFS=1 + IPFS_DIR=/data/ipfs to persist pins. Use the
    # NAMED volume below (pre-created node-owned in the image); a bind mount or a
    # different IPFS_DIR is root-owned and the node user cannot write to it (see
    # docs/DEPLOY.md).
    # volumes:
    #   - ipfs-data:/data/ipfs

# volumes:
#   ipfs-data:
